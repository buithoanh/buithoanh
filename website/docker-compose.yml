# Chạy trên server:  cp .env.example .env  (điền), rồi  docker compose up -d --build
# Nạp dữ liệu mẫu lần đầu:  docker compose run --rm cong-cu npm run nap-du-lieu
services:
  web:
    build: { context: ., target: runner }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://vc:${POSTGRES_PASSWORD}@db:5432/thotoi
    ports: ["127.0.0.1:3000:3000"]   # đặt Caddy/Nginx phía trước để có HTTPS
    volumes: [media:/app/media]
    depends_on: { db: { condition: service_healthy } }

  # Việc định kỳ (gửi link đánh giá 24 giờ sau khi xong, đăng bài hẹn giờ, dọn mã tra cứu cũ): gọi web mỗi 5 phút.
  hen-gio:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/sh", "-c", "while true; do curl -fsS -X POST -H \"Authorization: Bearer $$VIEC_DINH_KY_KEY\" http://web:3000/api/viec-dinh-ky > /dev/null || echo 'việc định kỳ lỗi'; sleep 300; done"]
    depends_on: [web]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: thotoi
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vc -d thotoi"]
      interval: 5s
      retries: 10

  cong-cu:
    build: { context: ., target: builder }
    profiles: [cong-cu]
    env_file: .env
    environment:
      DATABASE_URL: postgres://vc:${POSTGRES_PASSWORD}@db:5432/thotoi
      NODE_ENV: production
    depends_on: { db: { condition: service_healthy } }

volumes:
  db:
  media:
