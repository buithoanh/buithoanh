<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6edf5"/><stop offset="1" stop-color="#f7f9fc"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1d3a5a"/><stop offset="1" stop-color="#13283f"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="300" r="250" fill="#dbe5f0"/>
  <circle cx="400" cy="300" r="180" fill="#e9eff6"/>
  <ellipse cx="400" cy="512" rx="250" ry="16" fill="#13283f" opacity=".18"/>
  <!-- cables -->
  <path d="M290 214 C 260 140, 180 130, 150 190" fill="none" stroke="#d63c2f" stroke-width="16" stroke-linecap="round"/>
  <path d="M510 214 C 540 140, 620 130, 650 190" fill="none" stroke="#1b2430" stroke-width="16" stroke-linecap="round"/>
  <!-- clamps -->
  <g transform="translate(150 196) rotate(-15)">
    <rect x="-22" y="-6" width="44" height="64" rx="10" fill="#d63c2f"/>
    <rect x="-16" y="54" width="10" height="26" rx="3" fill="#9fb0c3"/><rect x="6" y="54" width="10" height="26" rx="3" fill="#9fb0c3"/>
  </g>
  <g transform="translate(650 196) rotate(15)">
    <rect x="-22" y="-6" width="44" height="64" rx="10" fill="#1b2430"/>
    <rect x="-16" y="54" width="10" height="26" rx="3" fill="#9fb0c3"/><rect x="6" y="54" width="10" height="26" rx="3" fill="#9fb0c3"/>
  </g>
  <!-- terminals -->
  <rect x="266" y="206" width="48" height="34" rx="6" fill="#c3cdd8"/>
  <rect x="486" y="206" width="48" height="34" rx="6" fill="#c3cdd8"/>
  <rect x="258" y="230" width="64" height="14" rx="4" fill="#d63c2f"/>
  <rect x="478" y="230" width="64" height="14" rx="4" fill="#1b2430"/>
  <!-- battery body -->
  <rect x="200" y="240" width="400" height="260" rx="22" fill="url(#body)"/>
  <rect x="200" y="240" width="400" height="44" rx="22" fill="#2a4b70"/>
  <rect x="200" y="262" width="400" height="22" fill="#2a4b70"/>
  <text x="290" y="276" text-anchor="middle" font-family="Be Vietnam Pro, Arial, sans-serif" font-weight="800" font-size="34" fill="#ff9a5c">+</text>
  <text x="510" y="276" text-anchor="middle" font-family="Be Vietnam Pro, Arial, sans-serif" font-weight="800" font-size="34" fill="#ffffff">−</text>
  <!-- label -->
  <rect x="236" y="312" width="328" height="150" rx="14" fill="#e8590c"/>
  <path d="M410 330 L360 398 H396 L382 446 L446 370 H408 L424 330 Z" fill="#ffffff"/>
  <!-- charge level -->
  <g transform="translate(250 336)">
    <rect x="0" y="0" width="86" height="40" rx="8" fill="none" stroke="#fff" stroke-width="5"/>
    <rect x="86" y="12" width="8" height="16" rx="2" fill="#fff"/>
    <rect x="9" y="9" width="18" height="22" rx="3" fill="#fff"/>
    <rect x="31" y="9" width="18" height="22" rx="3" fill="#fff"/>
    <rect x="53" y="9" width="18" height="22" rx="3" fill="#fff" opacity=".35"/>
  </g>
  <g fill="#fff" opacity=".55"><rect x="476" y="420" width="70" height="8" rx="4"/><rect x="496" y="436" width="50" height="8" rx="4"/></g>
  <!-- sparks -->
  <g stroke="#e8590c" stroke-width="6" stroke-linecap="round">
    <path d="M120 300l-24-8"/><path d="M128 330l-26 10"/><path d="M680 300l24-8"/><path d="M672 330l26 10"/>
  </g>
</svg>
