    <rect x="146" y="0" width="48" height="18" rx="6" fill="#e8590c"/>
    <path d="M30 56 h50 v-26 h-30 z" fill="#1d3a5a"/>
    <rect x="26" y="120" width="168" height="120" rx="12" fill="#e8590c"/>
    <path d="M110 140 C 110 140, 80 178, 80 196 a30 30 0 0 0 60 0 C 140 178, 110 140, 110 140z" fill="#ffffff"/>
    <rect x="26" y="252" width="168" height="10" rx="5" fill="#2a4b70"/>
  </g>
  <!-- oil filter -->
  <g transform="translate(430 250)">
    <rect x="0" y="20" width="130" height="220" rx="20" fill="#e8590c"/>
    <rect x="0" y="0" width="130" height="36" rx="10" fill="#c2410c"/>
    <g fill="#c2410c"><rect x="18" y="60" width="10" height="160" rx="5"/><rect x="42" y="60" width="10" height="160" rx="5"/><rect x="66" y="60" width="10" height="160" rx="5"/><rect x="90" y="60" width="10" height="160" rx="5"/></g>
    <rect x="0" y="226" width="130" height="18" rx="6" fill="#13283f"/>
  </g>
