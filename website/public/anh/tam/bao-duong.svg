<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6edf5"/><stop offset="1" stop-color="#f7f9fc"/></linearGradient>
    <linearGradient id="oil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc53d"/><stop offset="1" stop-color="#e89a0c"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="300" r="250" fill="#dbe5f0"/>
  <ellipse cx="400" cy="520" rx="300" ry="16" fill="#13283f" opacity=".18"/>
  <!-- oil jug -->
  <g transform="translate(150 190)">
