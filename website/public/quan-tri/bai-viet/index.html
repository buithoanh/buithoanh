<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Soạn bài – VC Mobile Care</title>
</head>
<body>
  <!-- Decap CMS: soạn bài trên web, mỗi lần lưu là một pull request để duyệt. Cấu hình: config.yml cùng thư mục. -->
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="https://unpkg.com/decap-cms@3.16.1/dist/decap-cms.js"></script>
  <script>
    // Đăng nhập GitHub qua chính website này (functions/api/cms/), nên base_url là địa chỉ đang mở.
    CMS.init({ config: { backend: { base_url: window.location.origin } } });
  </script>
</body>
</html>
